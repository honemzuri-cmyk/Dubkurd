<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubKurd - سەکۆی زیرەکی کوردی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 550px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input[type="file"], select, textarea, input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            line-height: 1.6;
        }
        .output-box {
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
        }
        video {
            width: 100%;
            border-radius: 6px;
        }
        #subtitleOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
            max-width: 90%;
            display: none;
            direction: rtl;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DubKurd</h2>
        <p class="subtitle">سیستمی شیکردنەوە و وەرگێڕانی ڤیدیۆ بۆ زمانی کوردی</p>

        <div class="form-group">
            <label>کلیلی API (Gemini API Key):</label>
            <input type="password" id="apiKey" placeholder="کلیلی API لێرە بنووسە...">
        </div>

        <div class="form-group">
            <label>هەڵبژاردنی ڤیدیۆ:</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>

        <div class="form-group">
            <label>دەقی وەرگێڕدراو و کاتەکان (Sorani):</label>
            <textarea id="kurdishText" placeholder="ئەنجام لێرە دەردەکەوێت..."></textarea>
        </div>

        <button onclick="processAISubtitles()">دەستپێکردنی پرۆسێسکردن</button>

        <div class="status" id="statusMessage"></div>

        <div class="output-box" id="outputBox">
            <label>پیشاندانی ڤیدیۆ:</label>
            <div class="video-wrapper">
                <video id="resultVideo" controls></video>
                <div id="subtitleOverlay">ژێرنووس...</div>
            </div>
            <br>
            <a id="downloadLink" style="display:inline-block; margin-top:10px; color:#38bdf8; text-decoration:underline;" download="output_video.mp4">داگرتنی ڤیدیۆ</a>
        </div>
    </div>

    <script>
        let subtitleCues = [];

        async function processAISubtitles() {
            const apiKey = document.getElementById('apiKey').value;
            const videoInput = document.getElementById('videoFile').files[0];
            const statusMessage = document.getElementById('statusMessage');
            const kurdishTextArea = document.getElementById('kurdishText');
            const outputBox = document.getElementById('outputBox');
            const resultVideo = document.getElementById('resultVideo');
            const downloadLink = document.getElementById('downloadLink');
            const subtitleOverlay = document.getElementById('subtitleOverlay');

            if (!apiKey) {
                alert('تکایە کلیلی API بنووسە!');
                return;
            }

            if (!videoInput) {
                alert('تکایە سەرەتا ڤیدیۆیەک هەڵبژێرە!');
                return;
            }

            statusMessage.innerHTML = 'خەریکی شیکردنەوەی ڤیدیۆیە... چاوەڕوان ببن...';
            outputBox.style.display = 'none';

            try {
                const base64Data = await fileToBase64(videoInput);

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Analyze the speech in this video. Provide timestamped transcriptions translated into Sorani Kurdish (کوردی). Format each line as [StartSeconds - EndSeconds] Kurdish text." },
                                {
                                    inline_data: {
                                        mime_type: videoInput.type || "video/mp4",
                                        data: base64Data
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    kurdishTextArea.value = "API Error: " + data.error.message;
                    statusMessage.innerHTML = 'هەڵەیەک ڕوویدا.';
                    return;
                }
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const resultText = data.candidates[0].content.parts[0].text;
                    kurdishTextArea.value = resultText;
                    statusMessage.innerHTML = 'ئامادە بوو!';
                    
                    parseSubtitles(resultText);
                } else {
                    kurdishTextArea.value = "وەڵام نەگەڕایەوە.";
                    statusMessage.innerHTML = 'هەوڵ بدەرەوە.';
                }

                const videoURL = URL.createObjectURL(videoInput);
                resultVideo.src = videoURL;
                downloadLink.href = videoURL;
                outputBox.style.display = 'block';

                resultVideo.ontimeupdate = () => {
                    const currentTime = resultVideo.currentTime;
                    const currentCue = subtitleCues.find(cue => currentTime >= cue.start && currentTime <= cue.end);
                    if (currentCue) {
                        subtitleOverlay.style.display = 'block';
                        subtitleOverlay.innerText = currentCue.text;
                    } else {
                        subtitleOverlay.style.display = 'none';
                    }
                };

            } catch (error) {
                console.error(error);
                kurdishTextArea.value = "Error: " + error.message;
                statusMessage.innerHTML = 'هەڵەیەک ڕوویدا.';
            }
        }

        function parseSubtitles(text) {
            subtitleCues = [];
            const lines = text.split('\n');
            lines.forEach(line => {
                const match = line.match(/\[\s*([\d.]+)\s*-\s*([\d.]+)\s*\]\s*(.+)/);
                if (match) {
                    subtitleCues.push({
                        start: parseFloat(match[1]),
                        end: parseFloat(match[2]),
                        text: match[3].trim()
                    });
                }
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
                    resolve(encoded);
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
