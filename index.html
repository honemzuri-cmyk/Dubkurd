<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubKurd - وەرگێڕانی ڤیدیۆ بۆ دەقی کوردی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 550px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input[type="file"], textarea, input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 140px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DubKurd</h2>
        <p class="subtitle">وەرگێڕانی قسەی ناو ڤیدیۆ بۆ دەقی کوردی (سۆرانی)</p>

        <div class="form-group">
            <label>کلیلی API (Gemini API Key):</label>
            <input type="password" id="apiKey" placeholder="کلیلی API لێرە بنووسە...">
        </div>

        <div class="form-group">
            <label>هەڵبژاردنی فایلی ڤیدیۆ:</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>

        <button onclick="processVideoToKurdishText()">دەرهێنانی دەق بە کوردی</button>

        <div class="form-group" style="margin-top: 20px;">
            <label>دەقی وەرگێڕدراوی کوردی (بۆ کۆپیکردن):</label>
            <textarea id="kurdishText" readonly placeholder="دەقی وەرگێڕدراو لێرە دەردەکەوێت..."></textarea>
        </div>

        <div class="status" id="statusMessage"></div>
    </div>

    <script>
        async function processVideoToKurdishText() {
            const apiKey = document.getElementById('apiKey').value;
            const videoInput = document.getElementById('videoFile').files[0];
            const statusMessage = document.getElementById('statusMessage');
            const kurdishTextArea = document.getElementById('kurdishText');

            if (!apiKey) {
                alert('تکایە کلیلی API بنووسە!');
                return;
            }

            if (!videoInput) {
                alert('تکایە سەرەتا ڤیدیۆیەک هەڵبژێرە!');
                return;
            }

            statusMessage.innerHTML = 'خەریکی گوێگرتن و وەرگێڕانی قسەکانی ناو ڤیدیۆکەیە... چاوەڕوان ببن...';
            kurdishTextArea.value = '';

            try {
                const base64Data = await fileToBase64(videoInput);

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Listen to the audio in this video and translate all spoken words directly into clear, natural Sorani Kurdish (کوردیی سۆرانی) text. Output only the Kurdish text without any extra notes." },
                                {
                                    inline_data: {
                                        mime_type: videoInput.type || "video/mp4",
                                        data: base64Data
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    kurdishTextArea.value = "API Error: " + data.error.message;
                    statusMessage.innerHTML = 'هەڵەیەک ڕوویدا.';
                    return;
                }

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    kurdishTextArea.value = data.candidates[0].content.parts[0].text.trim();
                    statusMessage.innerHTML = 'سەرکەوتوو بوو! دەقە کوردییەکە ئامادەیە.';
                } else {
                    kurdishTextArea.value = "وەڵام نەگەڕایەوە.";
                    statusMessage.innerHTML = 'تکایە هەوڵ بدەرەوە.';
                }

            } catch (error) {
                console.error(error);
                kurdishTextArea.value = "Error: " + error.message;
                statusMessage.innerHTML = 'هەڵەیەک لە پەیوەندی دروست بوو.';
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
                    resolve(encoded);
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
