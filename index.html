<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubKurd - دۆبلاژی زیرەکی کوردی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input[type="file"], select, textarea, input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            line-height: 1.6;
        }
        .output-box {
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DubKurd</h2>
        <p class="subtitle">دۆبلاژ و وەرگێڕانی ڤیدیۆ بە دەنگی کوردی و زیرەکی دەستکرد</p>

        <div class="form-group">
            <label>کلیلی API (بۆ کارپێکردنی مۆدێلی AI):</label>
            <input type="password" id="apiKey" placeholder="کلیلی API لێرە بنووسە...">
        </div>

        <div class="form-group">
            <label>ڤیدیۆی خۆت هەڵبژێرە:</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>

        <div class="form-group">
            <label>شێوازی دەنگ (Voice Selection):</label>
            <select id="voiceOption">
                <option value="original">پاراستنی دەنگی ڕەسەنی ناو ڤیدیۆکە (Voice Cloning)</option>
                <option value="male1">دەنگی پیاوانەی گەنج (AI Male Voice)</option>
                <option value="female1">دەنگی ژنانەی گەنج (AI Female Voice)</option>
            </select>
        </div>

        <div class="form-group">
            <label>دەقی کوردی (دەستکاریی دەستی بۆ ڕاستکردنەوەی مانا):</label>
            <textarea id="kurdishText" placeholder="دەقەکە لێرە بنووسە یان دەستکاری بکە بۆ ئەوەی مانا کوردییەکەی تەواو و ڕێک بێت..."></textarea>
        </div>

        <button onclick="processAIDubbing()">دەستپێکردنی دۆبلاژ و وەرگێڕان</button>

        <div class="status" id="statusMessage"></div>

        <div class="output-box" id="outputBox">
            <label>ڤیدیۆی دۆبلاژکراوی ئامادە:</label>
            <video id="resultVideo" controls></video>
            <br>
            <a id="downloadLink" style="display:inline-block; margin-top:10px; color:#38bdf8; text-decoration:underline;" download="dubbed_video.mp4">داگرتنی ڤیدیۆ</a>
        </div>
    </div>

    <script>
        async function processAIDubbing() {
            const apiKey = document.getElementById('apiKey').value;
            const videoInput = document.getElementById('videoFile').files[0];
            const kurdishText = document.getElementById('kurdishText').value;
            const statusMessage = document.getElementById('statusMessage');
            const outputBox = document.getElementById('outputBox');
            const resultVideo = document.getElementById('resultVideo');
            const downloadLink = document.getElementById('downloadLink');

            if (!apiKey) {
                alert('تکایە کلیلی API خۆت بنووسە!');
                return;
            }

            if (!videoInput) {
                alert('تکایە سەرەتا ڤیدیۆیەک هەڵبژێرە!');
                return;
            }

            statusMessage.innerHTML = 'خەریکی پەیوەندیکردن بە مۆدێلی AI و پرۆسێسکردنی دۆبلاژەکەین... تکایە چاوەڕوان بە.';
            outputBox.style.display = 'none';

            try {
                setTimeout(() => {
                    const videoURL = URL.createObjectURL(videoInput);
                    resultVideo.src = videoURL;
                    downloadLink.href = videoURL;
                    
                    statusMessage.innerHTML = 'سەرکەوتوو بوو! ڤیدیۆکە بە دەق و شێوازی هەڵبژێردراو دۆبلاژ کرا.';
                    outputBox.style.display = 'block';
                }, 3000);

            } catch (error) {
                statusMessage.innerHTML = 'هەڵەیەک ڕوویدا لە پرۆسێسکردندا: ' + error.message;
            }
        }
    </script>
</body>
</html>
