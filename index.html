<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubKurd - دۆبلاژی زیرەکی کوردی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input[type="file"], select, textarea, input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 110px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            line-height: 1.6;
        }
        .output-box {
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DubKurd</h2>
        <p class="subtitle">وەرگێڕانی ئۆتۆماتیکی ڤیدیۆ بۆ کوردی (وەک Heygen)</p>

        <div class="form-group">
            <label>کلیلی API (Gemini API Key):</label>
            <input type="password" id="apiKey" placeholder="کلیلی API لێرە بنووسە...">
        </div>

        <div class="form-group">
            <label>ڤیدیۆی خۆت هەڵبژێرە:</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>

        <div class="form-group">
            <label>شێوازی دەنگ (Voice Selection):</label>
            <select id="voiceOption">
                <option value="original">پاراستنی دەنگی ڕەسەنی ناو ڤیدیۆکە</option>
                <option value="male1">دەنگی پیاوانەی گەنج</option>
                <option value="female1">دەنگی ژنانەی گەنج</option>
            </select>
        </div>

        <div class="form-group">
            <label>دەقی کوردی (ئۆتۆماتیکی پڕ دەبێتەوە + دەستکاریی دەستی):</label>
            <textarea id="kurdishText" placeholder="کاتێک دەست پێ دەکەیت، دەقەکە بە شێوەیەکی ئۆتۆماتیکی لێرە دەنوسرێت و دەتوانیت دەستکاری بکەیت..."></textarea>
        </div>

        <button onclick="processAIDubbing()">وەرگێڕانی ئۆتۆماتیکی دەق لە ڤیدیۆ</button>

        <div class="status" id="statusMessage"></div>

        <div class="output-box" id="outputBox">
            <label>ڤیدیۆی ئەنجام:</label>
            <video id="resultVideo" controls></video>
            <br>
            <a id="downloadLink" style="display:inline-block; margin-top:10px; color:#38bdf8; text-decoration:underline;" download="dubbed_video.mp4">داگرتنی ڤیدیۆ</a>
        </div>
    </div>

    <script>
        async function processAIDubbing() {
            const apiKey = document.getElementById('apiKey').value;
            const videoInput = document.getElementById('videoFile').files[0];
            const statusMessage = document.getElementById('statusMessage');
            const kurdishTextArea = document.getElementById('kurdishText');
            const outputBox = document.getElementById('outputBox');
            const resultVideo = document.getElementById('resultVideo');
            const downloadLink = document.getElementById('downloadLink');

            if (!apiKey) {
                alert('تکایە کلیلی API خۆت بنووسە!');
                return;
            }

            if (!videoInput) {
                alert('تکایە سەرەتا ڤیدیۆیەک هەڵبژێرە!');
                return;
            }

            statusMessage.innerHTML = 'خەریکی خوێندنەوەی ڤیدیۆکە و نووسینی دەقی کوردییە بە شێوەیەکی ئۆتۆماتیکی... چاوەڕوان ببن...';
            outputBox.style.display = 'none';

            try {
                const base64Data = await fileToBase64(videoInput);

                const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "ئەم ڤیدیۆیە شیکار بکە و قسەکانی ناو ڤیدیۆکە وەکو دەق بە زمانی کوردی (سۆرانی) بە شێوەیەکی ڕوان و ئۆتۆماتیکی بنووسە. تەنها وەرگێڕان و دەقەکە بنووسە بێ هیچ زیادەیەک." },
                                {
                                    inline_data: {
                                        mime_type: videoInput.type || "video/mp4",
                                        data: base64Data
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const translatedText = data.candidates[0].content.parts[0].text;
                    kurdishTextArea.value = translatedText;
                    statusMessage.innerHTML = 'سەرکەوتوو بوو! دەقەکە بە شێوەیەکی ئۆتۆماتیکی نووسرا، ئێستا دەتوانیت هەر هەڵەیەک هەبوو تێیدا دەستکاری بکەیت.';
                } else {
                    kurdishTextArea.value = "ناتوانرا دەقەکە بە ئۆتۆماتیکی وەربگێڕرێت.";
                    statusMessage.innerHTML = 'تکایە دەقەکە خۆت پڕ بکەرەوە یان دووبارە هەوڵ بدە.';
                }

                const videoURL = URL.createObjectURL(videoInput);
                resultVideo.src = videoURL;
                downloadLink.href = videoURL;
                outputBox.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusMessage.innerHTML = 'هەڵەیەک ڕوویدا: ' + error.message;
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
                    resolve(encoded);
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
